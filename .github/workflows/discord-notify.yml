name: Notify Discord on push

on:
  push:
    branches: [ main ]  # ⇦ cámbialo si tu rama principal no es 'main'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # (Opcional) Si luego quieres listar todos los commits del push, necesitarás checkout.
      # - uses: actions/checkout@v4

      
name: Send message to Discord
      uses: appleboy/discord-action@v1.2.0
      with:
        webhook_url: ${{ secrets.WEBHOOK_URL }}# Variables del contexto de GitHub:# - github.ref_name = nombre corto de la rama# - github.sha = SHA del commit que disparó el workflow# - github.repository = owner/repo# - github.actor = usuario que hizo el push# - github.event.head_commit.message = mensaje del último commit del push
        message: |📦 Nuevo push en ${{ github.repository }}
          • Autor: ${{ github.actor }}
          • Rama: ${{ github.ref_name }}
          • Commit: ${{ github.sha }}
          • Mensaje: ${{ github.event.head_commit.message }}
          • Ver commit: https://github.com/$%7B%7B github.repository }}/commit/${{ github.sha }}# Personalización opcional del "bot":
        username: "GitHub → Discord"# avatar_url: "https://tudominio.com/imagen.png"
        color: "#2b90d9"  # color del embed (opcional)
